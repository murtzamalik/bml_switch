# Self-contained server deploy for BML Switch.
# Isolated project name: bml_switch
# Host port: 18080 (app only). MySQL is internal — not published on host.
# Usage on server:
#   docker compose -p bml_switch -f docker-compose.server.yml up -d --build

name: bml_switch

services:
  mysql:
    image: mysql:8.4
    container_name: bml_switch_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bml_switch
      MYSQL_USER: bml_switch
      MYSQL_PASSWORD: change_me
      MYSQL_ROOT_PASSWORD: change_me_root
    volumes:
      - bml_switch_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ubml_switch", "-pchange_me"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - bml_switch_net

  app:
    build: .
    container_name: bml_switch_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bml_switch?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Karachi
      SPRING_DATASOURCE_USERNAME: bml_switch
      SPRING_DATASOURCE_PASSWORD: change_me
      # Live SOAP open+IFT; list/balance stay local DB. Override only if needed.
      MOCK_IMAL: "false"
      MOCK_OTP: "true"
      SANDBOX_MODE: "true"
      JWT_SECRET: change_me_min_32_chars_256bit_entropy____
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/v1/system/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - bml_switch_net

volumes:
  bml_switch_mysql_data:
    name: bml_switch_mysql_data

networks:
  bml_switch_net:
    name: bml_switch_net
